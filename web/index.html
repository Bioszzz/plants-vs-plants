<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121815">
<!-- 【v0.74】手机：加到主屏后全屏显示（iOS 认 apple-* 这一组；
     Android 没有 service worker 就只是普通快捷方式，仍带地址栏）。 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="植物斗争">
<meta name="mobile-web-app-capable" content="yes">
<title>植物斗争</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <span class="logo"></span>
      <h1>植物斗争</h1>
    </div>
    <div class="meta">
      <span id="srv-chip" class="chip hidden"></span>
      <!-- 【v0.76】回退是个"分裂按钮"：主键一下 = 退回本回合开始（最常用），
           旁边的小箭头才展开"上一回合 / 指定回合"。
           ★ 用户 2026-11-16："多态不应该影响方便性" —— 常用动作必须一下点完。 -->
      <button id="btn-undo" class="chip hidden" title="退回本回合开始（手抖了用）">↶ 回退</button>
      <button id="btn-undo-more" class="chip caret hidden" title="退到上一回合 / 指定回合">▾</button>
      <button id="btn-replay" class="chip hidden" title="把这一局导出成录像文件（可用 replay.py 重放）">⭳ 录像</button>
      <button id="btn-disc" class="chip hidden">断开</button>
      <span id="round-chip" class="chip">第 0 回合</span>
      <span id="me-chip" class="chip me">未连接</span>
    </div>
  </header>

  <section id="board" class="panel">
    <div class="panel-title">场面</div>
    <!-- 【v0.35】存活环：还活着的人按座位围成一圈，现场摘人。
         选目标和读名字都靠它（引擎 state 里的 ring 字段）。 -->
    <div id="ringwrap" class="hidden">
      <div class="ring-title">存活环（环上只剩这些人）</div>
      <div id="ring"></div>
      <!-- 【v0.62】队友链图例：哪几个人是一队的（纯展示，读引擎 state.teams）。 -->
      <div id="ring-legend" class="ring-legend"></div>
      <!-- 【v0.44】"空目标"出口：点环选人时，这里是"不选任何人"的按钮
           （目前用于刀类的"不切" —— 用户 2026-10-12："存活环旁边最好再加
            一个『空目标』选项"）。 -->
      <div id="ring-extra"></div>
    </div>
    <div id="players"></div>
    <div id="tags"></div>
  </section>

  <!-- 【v0.44】"你的操作"上移到【战报上方】：让存活环与交互按钮相邻，
       战报退到最下面（用户 2026-10-12："存活环和交互按钮中隔了一个战报。
       战报应该放在最下面，存活环和交互相邻"）。 -->
  <section id="deck" class="panel">
    <div class="panel-title" id="deck-title">你的操作</div>
    <div id="deck-body">
      <div class="hint">未连接</div>
    </div>
  </section>

  <section id="logwrap" class="panel">
    <div class="panel-title">战报</div>
    <div id="log"></div>
  </section>

</div>

<!-- 【v0.76】回退到哪一回合：点「▾」才弹这个；主键直接退本回合开始 -->
<div id="undo-pick" class="overlay hidden">
  <div class="connect-card">
    <h1 style="font-size:17px;letter-spacing:2px;margin:0 0 2px">退回到哪一步？</h1>
    <p class="sub" id="undo-hint">当前第 1 回合</p>

    <div class="undo-quick">
      <button class="btn" id="undo-this">本回合开始</button>
      <button class="btn" id="undo-prev">上一回合</button>
    </div>

    <div class="undo-grid">
      <label class="field">
        <span>指定回合（0 = 从开局重来）</span>
        <input id="undo-round" type="number" min="0" value="1" inputmode="numeric">
      </label>
      <button class="btn primary" id="undo-go">退回</button>
    </div>
    <p class="sub" style="margin-top:2px">第 0 回合 = 同一副牌、同一个随机种子，重开一遍</p>

    <div class="undo-quick" style="margin-top:14px">
      <button class="btn" id="undo-cancel" style="grid-column:1/-1">取消</button>
    </div>
    <div id="undo-err" class="err"></div>
  </div>
</div>

<!-- 连接界面：连上服务器之前盖住整个页面 -->
<div id="connect" class="overlay">
  <div class="connect-card">
    <div class="brand big">
      <span class="logo"></span>
      <h1>植物斗争</h1>
    </div>
    <p class="sub">网页版客户端 —— 连上服务器开始对局</p>

    <!-- 【v0.35】起名：进房前给自己起个名字，战报里就显示"名字(编号)"。
         名字缓存在本机（webui 同目录的 names.json），下次自动带出。 -->
    <label class="field">
      <span>你的名字</span>
      <input id="myname" maxlength="16" placeholder="不填就用 player1 / player2 …"
             list="name-history" spellcheck="false" autocomplete="off">
    </label>
    <datalist id="name-history"></datalist>

    <label class="field">
      <span>服务器 IP</span>
      <input id="ip" value="127.0.0.1" spellcheck="false" autocomplete="off">
    </label>
    <label class="field">
      <span>端口</span>
      <input id="port" value="8080" inputmode="numeric" autocomplete="off">
    </label>
    <button id="btn-connect" class="btn primary wide">连接服务器</button>

    <div id="conn-err" class="err"></div>

    <div class="or"><span>或</span></div>

    <!-- 【v0.76】玩家选项 —— 都是"我这一端"的偏好，不是房间规则（房间规则由房主定）。
         原来这里是「本机开一局」的人数 / 电脑 / 种子 / 可选规则；
         那个功能被「多开试玩台」整个覆盖了，已经删掉。 -->
    <div class="panel-title" id="prefs-title" style="margin:10px 0 6px">玩家选项</div>
    <div class="prefs" id="prefs-box">
      <label>
        <input type="checkbox" id="p-record">
        <span><b>自动录像</b> —— 把这一局另存一份到我的 <code>对局录像/</code>，随时能重放</span>
      </label>
      <label>
        <input type="checkbox" id="p-friendly">
        <span><b>服务器友好</b> —— 服务器只发操作不发战报，战报在我本地算（帮房主省带宽）</span>
      </label>
    </div>

    <p class="tip">
      局域网联机：房主运行 <code>python netserver.py</code>（自带房主控制台网页），<br>
      其他人在上面填房主的地址再点「连接服务器」。<br>
      跨网（校园网 / 不同城市的宽带）要先组虚拟局域网 —— 见 README 的联机一节。
    </p>

    <!-- 【v0.19】版次与检查更新。
         版本号由 webui.py 从 VERSION 文件（git tag 生成）读出来下发，
         页面上不写死 —— 否则每次发版都要改前端，迟早忘了改。 -->
    <div class="ver">
      <span>版次</span><span class="vno" id="ver-no">…</span>
      <button class="lnk" id="btn-update">检查更新</button>
    </div>
    <div class="newver" id="ver-msg"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
